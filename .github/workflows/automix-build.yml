name: Build AutoMix DSP

# Builds foo_dsp_automix (x64) from the automix branch and publishes the component to the automix-dll branch.
on:
  push:
    branches: [automix]
    paths: ['automix/**', '.github/workflows/automix-build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup MSVC command line
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch qm-dsp and SoundTouch
        run: automix\fetch-libs.ps1

      # output also goes to build_log.txt, which is published to the automix-log branch on failure
      - name: Self-checks (mix math, beat tracking)
        working-directory: automix/tests
        run: |
          $log = "$env:GITHUB_WORKSPACE\build_log.txt"
          $q = '..\ext\qm-dsp'
          $qm = "$q\dsp\onsets\DetectionFunction.cpp $q\dsp\phasevocoder\PhaseVocoder.cpp $q\dsp\transforms\FFT.cpp $q\dsp\tempotracking\TempoTrackV2.cpp $q\dsp\tempotracking\DownBeat.cpp $q\dsp\rateconversion\Decimator.cpp $q\maths\MathUtilities.cpp $q\maths\KLDivergence.cpp $q\ext\kissfft\kiss_fft.c $q\ext\kissfft\tools\kiss_fftr.c"
          cmd /c "cl /nologo /EHsc /std:c++20 /I..\src test_mix.cpp 2>&1" | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_mix.exe *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmd /c "cl /nologo /EHsc /std:c++20 /O2 /D_USE_MATH_DEFINES /Dkiss_fft_scalar=double /I..\src /I$q /I$q\ext\kissfft /I$q\ext\kissfft\tools test_beats.cpp ..\src\beats.cpp $qm 2>&1" | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_beats.exe *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build
        run: msbuild automix\foo_dsp_automix.sln /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /v:minimal "/flp:logfile=build_log.txt;verbosity=normal;append"

      - name: Package component
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item automix\bin\Release_x64\foo_dsp_automix.dll out\
          Compress-Archive -Path out\foo_dsp_automix.dll -DestinationPath out\foo_dsp_automix.zip
          Rename-Item out\foo_dsp_automix.zip foo_dsp_automix.fb2k-component

      - name: Upload component
        uses: actions/upload-artifact@v6
        with:
          name: foo_dsp_automix-x64
          path: out/

      # also commit it to the automix-dll branch, so it can be fetched over git
      - name: Publish to the automix-dll branch
        shell: bash
        run: |
          mkdir -p ../dll && cp out/foo_dsp_automix.dll out/foo_dsp_automix.fb2k-component ../dll/
          cd ../dll && git init -q && git checkout -q -b automix-dll
          git add . && git -c user.name=ci -c user.email=ci@local commit -q -m "AutoMix from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" automix-dll

      # build log on a branch too: job logs need a sign-in, a branch can be fetched over git
      - name: Publish build log on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p ../log && cp build_log.txt ../log/ 2>/dev/null || echo "no log" > ../log/build_log.txt
          cd ../log && git init -q && git checkout -q -b automix-log
          git add . && git -c user.name=ci -c user.email=ci@local commit -q -m "Build log from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" automix-log
